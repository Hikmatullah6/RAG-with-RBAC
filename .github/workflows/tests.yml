# Runs on every push to main, every pull request, and on demand (Actions tab > tests > Run workflow).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Build the vector database
        run: python app/ingest.py

      - name: Run security tests
        working-directory: app
        env:
          # Set in GitHub: Settings > Secrets and variables > Actions.
          # Without it, the prompt-injection tests are skipped; everything else still runs.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests -v

  docker-build:
    # Only build the image if the security tests passed
    needs: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t rag-rbac .